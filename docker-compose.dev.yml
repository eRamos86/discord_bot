# Isolated development database mirroring production defaults
# (user/database discord_bot, disposable credentials, local port 5433).
# Started automatically by `npm run dev`.
services:
    postgres:
        image: postgres:16.10-bookworm
        environment:
            POSTGRES_USER: discord_bot
            POSTGRES_PASSWORD: discord_bot_dev
            POSTGRES_DB: discord_bot
        ports:
            - '127.0.0.1:5433:5432'
        volumes:
            - postgres_dev_data:/var/lib/postgresql/data
        healthcheck:
            test: [CMD-SHELL, 'pg_isready -U discord_bot -d discord_bot']
            interval: 5s
            retries: 10
volumes:
    postgres_dev_data:
