services:
  postgres:
    image: postgres:16-alpine
    container_name: discord_bot_db_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: discord_bot
      POSTGRES_PASSWORD: discord_bot_dev
      POSTGRES_DB: discord_bot
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  discord_bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: discord_bot_dev
    restart: unless-stopped
    depends_on:
      - postgres
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - HEALTH_PORT=3000
      - DATABASE_URL=postgresql://discord_bot:discord_bot_dev@postgres:5432/discord_bot
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    command: npm run dev

volumes:
  postgres_dev_data: