version: '3.8'

services:
  discord_bot:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: discord_bot_dev
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=development
    volumes:
      - ./src:/app/src:ro
    command: npm run dev

networks:
  default:
    name: discord_bot_dev_network
    external: false