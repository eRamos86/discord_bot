services:
  postgres:
    image: postgres:16.10-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: discord_bot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: discord_bot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U discord_bot -d discord_bot']
      interval: 10s
      timeout: 5s
      retries: 5
  migrate:
    build: .
    image: ${BOT_IMAGE:-discord-bot:local}
    command: [node, dist/database/migrate.js]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://discord_bot:${POSTGRES_PASSWORD}@postgres:5432/discord_bot
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
  discord_bot:
    build: .
    image: ${BOT_IMAGE:-discord-bot:local}
    init: true
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      HEALTH_PORT: '3000'
      DATABASE_URL: postgresql://discord_bot:${POSTGRES_PASSWORD}@postgres:5432/discord_bot
    ports:
      - '127.0.0.1:3005:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
volumes:
  postgres_data:
