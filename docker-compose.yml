services:
  discord_bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: discord_bot
    restart: always
    environment:
      - TOKEN=${TOKEN}
      - OWNER_1=${OWNER_1}
      - OWNER_2=${OWNER_2}
      - OWNER_3=${OWNER_3}
      - DEV_GUILD=${DEV_GUILD}
      - CLIENT_ID=${CLIENT_ID}
      - NODE_ENV=${NODE_ENV}
    healthcheck:
      test: ["CMD", "node", "dist/healthcheck.js"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s