services:
  postgres:
    image: postgres:16-alpine
    container_name: discord_bot_db
    restart: always
    environment:
      POSTGRES_USER: discord_bot
      POSTGRES_PASSWORD: discord_bot_secret
      POSTGRES_DB: discord_bot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U discord_bot"]
      interval: 10s
      timeout: 5s
      retries: 5

  discord_bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: discord_bot
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - HEALTH_PORT=3000
      - DATABASE_URL=postgresql://discord_bot:discord_bot_secret@postgres:5432/discord_bot
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  postgres_data: