services:
  discord_bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: discord_bot
    restart: always
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "node", "dist/healthcheck.js"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s