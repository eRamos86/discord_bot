name: Deploy Discord Bot to poopmachine

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Connect to Tailnet (auth key)
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Deploy to poopmachine
        run: |
          # Write SSH key
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          # Deploy
          ssh \
            -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            ace@100.119.115.13 \
            "
              set -e
              cd ~/platform/DiscordBot
              git fetch origin main
              git reset --hard origin/main
              git clean -fd
              git checkout -f main
              echo 'TOKEN=${{ secrets.DISCORD_TOKEN }}' > .env
              echo 'OWNER_1=490178836202258437' >> .env
              echo 'OWNER_2=' >> .env
              echo 'OWNER_3=' >> .env
              echo 'DEV_GUILD=849749391619129374' >> .env
              echo 'CLIENT_ID=848351790345093180' >> .env
              echo 'NODE_ENV=production' >> .env
              docker compose up -d --build
              sleep 5
              docker compose logs discord_bot --tail 20
            "